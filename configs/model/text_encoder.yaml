# Small bidirectional document encoder (README "Text Conditioning"). Loaded
# separately from the causal LM config (via `text_encoder_config:` in an
# experiment yaml, not `include:`) since field names like hidden_size and
# num_hidden_layers would otherwise collide with the LM's own.
hidden_size: 256
intermediate_size: 1024
num_hidden_layers: 3
num_attention_heads: 4
num_key_value_heads: 4
max_position_embeddings: 513   # encoder_max_tokens (512) + 1 for the CLS position
rms_norm_eps: 1.0e-5
rope_theta: 10000.0
initializer_range: 0.02
pooling: cls   # "cls" or "mean"
