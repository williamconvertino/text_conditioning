# Default backbone for the initial small-scale experiments (~400M params --
# see llama_small.yaml for the older ~170M config it replaced). Still far
# below the README's literal Llama-3.2-3B target (llama3_3b.yaml), but a
# more representative "standard" Llama-style scale to validate the
# conditioning signal at before committing a full compute budget.
#
# `model_size` is not read by the model itself -- scripts/train.py appends it
# to the run's output directory name (outputs/checkpoints/<experiment>_<model_size>) so
# that switching an experiment's `include:` to a different model config (e.g.
# llama3_3b.yaml) starts a fresh run dir instead of overwriting/resuming this
# one's checkpoints and logs.
model_size: medium
hidden_size: 1024
intermediate_size: 2816
num_hidden_layers: 24
num_attention_heads: 16
num_key_value_heads: 4
max_position_embeddings: 2049   # block_size (2048) + 1, for the conditioning position
rms_norm_eps: 1.0e-5
rope_theta: 500000.0
initializer_range: 0.02
tie_word_embeddings: true
