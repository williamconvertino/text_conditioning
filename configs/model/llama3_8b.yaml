# Llama-3.1-8B architecture (meta-llama/Llama-3.1-8B config.json; Llama 3.2
# has no 8B text model): 32 layers, d_model 4096, SwiGLU 14336, 32 query / 8
# KV heads (head_dim 128), RoPE theta 500k, *untied* input/output embeddings,
# 128,256-token vocab. ~8.03B params (6.98B non-embedding).
#
# max_position_embeddings is this repo's block_size + 1 (the conditioning
# position) instead of 131072, and there is no "llama3" RoPE scaling (it only
# matters beyond the original 8K context).
# Used via configs/scale/8b.yaml; runs land in outputs/checkpoints/<experiment>_8b.
model_size: 8b
hidden_size: 4096
intermediate_size: 14336
num_hidden_layers: 32
num_attention_heads: 32
num_key_value_heads: 8
max_position_embeddings: 2049
rms_norm_eps: 1.0e-5
rope_theta: 500000.0
initializer_range: 0.02
tie_word_embeddings: false
