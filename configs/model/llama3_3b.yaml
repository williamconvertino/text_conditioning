# The README's named target architecture, close to Llama-3.2-3B. Not used by any
# default experiment config in this repo (see llama_medium.yaml for why); point
# an experiment's `include:` at this file instead once you're ready to scale up
# to the full size -- doing so automatically moves that experiment's runs to a
# new outputs/<experiment>_full directory (see model_size below), so nothing
# from the medium-scale runs gets overwritten.
model_size: full
hidden_size: 3072
intermediate_size: 8192
num_hidden_layers: 28
num_attention_heads: 24
num_key_value_heads: 8
max_position_embeddings: 2049
rms_norm_eps: 1.0e-5
rope_theta: 500000.0
initializer_range: 0.02
tie_word_embeddings: false
