# The 1.5B Llama of "URLs Help, Topics Guide" (Fan et al., 2025) and "Beyond
# URLs" (Fan et al., 2025, arXiv:2511.21613): 16 layers, d_model 2048 (both
# papers), with the rest of Llama-3.2-1B's architecture -- SwiGLU 8192, 32
# query / 8 KV heads (head_dim 64), RoPE theta 500k -- and *untied*
# input/output embeddings. With the 128,256-token Llama 3 vocab that is
# 0.97B non-embedding + 2 x 0.26B embedding = 1.50B params (check with
# scripts/count_params.py). The papers state only layers / d_model / 1.5B;
# the remaining fields follow Llama 3, which they cite for the architecture.
#
# max_position_embeddings = block_size (4096, the papers' sequence length) + 1.
# Used via configs/scale/1.5b.yaml.
model_size: 1.5b
hidden_size: 2048
intermediate_size: 8192
num_hidden_layers: 16
num_attention_heads: 32
num_key_value_heads: 8
max_position_embeddings: 4097
rms_norm_eps: 1.0e-5
rope_theta: 500000.0
initializer_range: 0.02
tie_word_embeddings: false
