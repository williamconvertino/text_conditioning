# Experiment G -- Same-Domain Conditioning: same architecture as
# text_conditioned.yaml, but each document is conditioned on the encoding of
# one random *other* training document from the same URL domain -- i.e.
# training uses the same condition as the final eval's "Same-Domain" mode
# (README "Domain-Conditioned Training", src/data/domain_index.py).
#
# A document whose domain has no other document in the training split (or
# whose URL has no parseable domain) gets the null vector, the same default
# conditioning a schedule-dropped example gets. conditioning_schedule works
# exactly as for self-conditioning: with probability 1 - p_condition a
# document gets the null vector even when it has an in-domain partner.
#
# Needs the training-split domain index first:
#   sbatch slurm/domain_conditioned/build_domain_index.slurm
include:
  - ../model/llama_medium.yaml
  - ../train/default.yaml
name: text_conditioned_domain_random
variant: text
text_encoder_config: ../model/text_encoder.yaml
text_conditioning_source: domain_random   # self | domain_random | domain_mean
domain_conditioning:
  index_dir: ./data/domain_index/100BT   # scripts/build_domain_index.py output
  min_domain_docs: 2    # a domain needs >= this many docs (target included) to be used
conditioning_schedule:
  kind: constant
  p_condition: 0.90
